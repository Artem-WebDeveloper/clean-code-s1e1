<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="main-content">
    <h1 class="visually-hidden">Todo App</h1>
    <figure class="info-section">
      <img class="info-section-image" src="./eisenhower-matrix.jpg">
      <figcaption class="info-caption">
        <a class="info-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </figcaption>
    </figure>
    <main class="content-wrapper">
      <div id="add-task-section">
        <label class="task-label" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task" class="task task-input" type="text">
          <button class="task-button">Add</button>
        </div>
      </div>
      <h2 class="task-title">Todo</h2>
      <ul class="task-list" id="incomplete-tasks">
        <li class="task-item">
          <input class="task-input" type="checkbox">
          <label class="task task-label">Pay Bills</label>
          <input type="text" class="task task-input">
          <button class="edit task-button">Edit</button>
          <button class="delete task-button">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input class="task-input" type="checkbox">
          <label class="task task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task task-input">
          <button class="edit task-button">Save</button>
          <button class="delete task-button">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
      </ul>
      <h2 class="task-title">Completed</h2>
      <ul class="task-list" id="completed-tasks">
        <li class="task-item">
          <input class="task-input" type="checkbox" checked>
          <label class="task task-label">See the Doctor</label>
          <input type="text" class="task task-input">
          <button class="edit task-button">Edit</button>
          <button class="delete task-button">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
